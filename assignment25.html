<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styled Multi-Page Project</title>
<style>
body { margin:0; font-family:Arial,sans-serif; background:#f4f6fb; color:#222; }
header, footer { background:#1b2a41; color:white; padding:20px; text-align:center; }
nav a { color:white; margin:10px; }
main { max-width:800px; margin:auto; padding:20px; }
section { background:white; padding:20px; margin:15px 0; border-radius:8px; }
h2 { color:#2a5d8f; }
button { background:#2a5d8f; color:white; padding:10px; border:0; }
</style>
</head>
<body>
<header>
<h1>My Website</h1>
<nav>
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#registration">Registration</a>
<a href="#contact">Contact</a>
</nav>
</header>
<main>
<section id="home">
<h2>Home</h2>
<p>Welcome to my styled multi-page project.</p>
</section>
<section id="about">
<h2>About</h2>
<p>I am a BCA (AI) student at Invertis University, Bareilly.</p>
</section>
<section id="registration">
<h2>Registration</h2>
<form>
<label for="name">Name:</label>
<input id="name" name="name" required>
<br><br>
<label for="email">Email:</label>
<input id="email" type="email" name="email" required>
<br><br>
<button type="submit">Register</button>
</form>
</section>
<section id="contact">
<h2>Contact</h2>
<p>Email: gyaneshwarrai8650@gmail.com</p>
</section>
</main>
<footer>Multi-Page Project</footer>
</body>
</html>
