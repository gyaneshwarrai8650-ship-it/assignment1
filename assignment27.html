<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Variants</title>
<style>
body { font-family:Arial,sans-serif; background:#f3f4f6; padding:20px; }
.cards { display:flex; flex-wrap:wrap; gap:20px; }
.card { width:220px; padding:20px; background:white; border-radius:10px; }
.basic { border:1px solid #ccc; }
.shadow { box-shadow:0 4px 12px #0002; }
.featured { border-top:5px solid #3d5af1; }
button { padding:8px 14px; background:#3d5af1; color:white; border:0; }
</style>
</head>
<body>
<h1>Three Card Variants</h1>
<div class="cards">
<div class="card basic">
<h2>Basic Card</h2>
<p>A simple card with a border.</p>
<button>Learn More</button>
</div>
<div class="card shadow">
<h2>Shadow Card</h2>
<p>A card with a shadow effect.</p>
<button>Learn More</button>
</div>
<div class="card featured">
<h2>Featured Card</h2>
<p>A card with a coloured top border.</p>
<button>Learn More</button>
</div>
</div>
</body>
</html>
