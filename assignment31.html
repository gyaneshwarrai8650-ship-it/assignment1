<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Menu Bar</title>
<style>
body { margin:0; font-family:Arial,sans-serif; }
nav { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; background:#1b2a41; padding:15px 25px; }
nav h2 { color:white; margin:0; }
.links { display:flex; gap:20px; flex-wrap:wrap; }
.links a { color:white; text-decoration:none; }
.links a:hover { color:#ffcc66; }
</style>
</head>
<body>
<nav>
<h2>My Website</h2>
<div class="links">
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#services">Services</a>
<a href="#contact">Contact</a>
</div>
</nav>
<h1 id="home">Welcome</h1>
</body>
</html>
