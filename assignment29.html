<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Position and Z-Index</title>
<style>
body { margin:0; font-family:Arial,sans-serif; }
.hero {
    position:relative;
    min-height:350px;
    display:flex;
    align-items:center;
    padding:40px;
    color:white;
    background:#1b2a41;
    overflow:hidden;
}
.hero img {
    position:absolute;
    right:0;
    top:0;
    width:55%;
    height:100%;
    object-fit:cover;
    opacity:.5;
    z-index:0;
}
.content { position:relative; z-index:1; max-width:450px; }
button { padding:10px 16px; cursor:pointer; }
</style>
</head>
<body>
<section class="hero">
<img src="https://picsum.photos/800/500" alt="Landscape background">
<div class="content">
<h1>Welcome to My Website</h1>
<p>Learn, create, and build new skills with web development.</p>
<button>Get Started</button>
</div>
</section>
</body>
</html>
