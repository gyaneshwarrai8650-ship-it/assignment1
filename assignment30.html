<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile and Product Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px 20px;
            color: #1e293b;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 30px;
        }

        .card {
            width: 300px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .student-photo {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .card-content {
            padding: 22px;
        }

        .card h2 {
            margin-bottom: 10px;
            font-size: 22px;
        }

        .card p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .tag {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            margin-top: 5px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .product-photo {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .price {
            font-size: 23px;
            font-weight: bold;
            color: #15803d;
            margin: 12px 0;
        }
    </style>
</head>

<body>

    <h1>Profile and Product Cards</h1>

    <div class="container">

        <!-- Student Profile Card -->
        <div class="card">
            <img
                class="student-photo"
                src="https://randomuser.me/api/portraits/men/32.jpg"
                alt="Random student profile photo"
            >

            <div class="card-content">
                <span class="tag">Student Profile</span>
                <h2>Rahul Sharma</h2>
                <p>BCA Student</p>
                <p>Interested in Web Development, Programming and Technology.</p>
                <a href="#" class="button">View Profile</a>
            </div>
        </div>

        <!-- Product Card -->
        <div class="card">
            <img
                class="product-photo"
                src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
                alt="Wireless headphones"
            >

            <div class="card-content">
                <span class="tag">Featured Product</span>
                <h2>Wireless Headphones</h2>
                <p>Comfortable headphones with a stylish design and clear sound.</p>
                <div class="price">₹1,499</div>
                <a href="#" class="button">Buy Now</a>
            </div>
        </div>

    </div>

</body>
</html>
